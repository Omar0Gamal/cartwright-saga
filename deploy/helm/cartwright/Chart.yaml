apiVersion: v2
name: cartwright
description: A Helm chart for Cartwright
version: 0.1.0
appVersion: "1.0"
dependencies:
  - name: postgresql
    version: 12.12.10
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: nats
    version: 1.1.8
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled
