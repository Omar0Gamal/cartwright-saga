syntax = "proto3";
package events.v1;
option go_package = "github.com/Omar0Gamal/cartwright/services/orchestrator/gen/events/v1";

import "google/protobuf/timestamp.proto";

message OrderConfirmed {
  string event_id    = 1;   // stable; used for de-duplication
  string order_id    = 2;
  string customer_id = 3;
  int64  total_cents = 4;
  string currency    = 5;
  google.protobuf.Timestamp occurred_at = 6;
  string correlation_id = 7;
}

message OrderCancelled {
  string event_id    = 1;
  string order_id    = 2;
  string customer_id = 3;
  string reason      = 4;
  google.protobuf.Timestamp occurred_at = 5;
  string correlation_id = 6;
}
