[project]
name = "notifier"
version = "0.1.0"
description = "Order event consumer for Cartwright"
authors = [
    { name = "Omar Gamal", email = "omar.gamal.m@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.16.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "protobuf>=7.36.2",
]

[project.scripts]
notifier = "notifier:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
exclude = ["src/notifier/gen"]
